<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://chalkboardlp.github.io/img/favicon.png" type="image/x-icon">
<title>Student Audio Player</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap');
</style>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: "Play", sans-serif;
      background-color: #ffffff;
      color: #222222;
    }

    /* MAIN CONTAINER */
    .protected-container {
      width: 100%;
      max-width: 900px;
      margin: 20px auto;
    }

    /* LOGIN BOX */
    .login-box {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      padding: 25px 20px;
      text-align: center;
      background-color: #f5f5f5;
      border: 1px solid #cccccc;
      border-radius: 12px;
	  font-family: "Play", sans-serif;
    }

    /* LOCK */
    .lock-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }


    /* TITLE */
    .login-box h2 {
      margin: 5px 0 10px;
      font-size: 22px;
    }

    /* DESCRIPTION */
    .login-box p {
      margin: 0 0 20px;
      color: #555555;
      font-size: 15px;
    }

    /* PASSWORD INPUT */
    #accessCode {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 0 auto 12px;
      font-size: 16px;
	  font-family: "Play", sans-serif;
      text-align: center;
      border: 1px solid #aaaaaa;
      border-radius: 7px;
      outline: none;
    }


    #accessCode:focus {
      border-color: #001c7d;
    }

    /* BUTTON */
    .access-button {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 0 auto;
      font-size: 16px;
	  font-family: "Play", sans-serif;
      font-weight: bold;
      color: white;
      background-color: #001c7d;
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .access-button:active {
      transform: scale(0.98);
    }

    /* MESSAGE */
    #message {
      min-height: 20px;
      margin-top: 15px;
      font-size: 14px;
    }

    /* IFRAME */
    #iframe-container {
      display: none;
      width: 100%;
      margin-top: 20px;
    }

    #secret-iframe {
      display: block;
      width: 100%;
      height: 80vh;
      min-height: 500px;
      border: none;
      border-radius: 8px;
      background-color: white;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .protected-container {
        margin: 10px auto;
      }

      .login-box {
        padding: 22px 15px;
        border-radius: 10px;
      }
      .login-box h2 {
        font-size: 20px;
      }
	  
      #accessCode {
        font-size: 16px;
        padding: 14px;
      }

      .access-button {
        padding: 14px;
      }

      #secret-iframe {
        height: 80vh;
        min-height: 450px;
        border-radius: 5px;
      }

    }

  </style>

</head>

<body>

  <div class="protected-container">
    <!-- ==============================
         ACCESS BOX
         ============================== -->
    <div id="login-box" class="login-box">
      <div class="lock-icon">🔐</div>
      <h2>Test Audio Player 1</h2>
<p>Ask the teacher to enter the access code to continue.</p>

      <input
        type="password"
        id="accessCode"
        placeholder="Access code"
        autocomplete="off"
      >


      <button
        class="access-button"
        onclick="unlockContent()"
      >
        ACCESS
      </button>
	  
	  </br>
	  <img style="border: 0px solid #B3B3B3;" src="https://3.bp.blogspot.com/-TtU2-IqoC18/Xr2vZgn9auI/AAAAAAAAM40/m3nIt2ap44Qsxq-UmQcfT0D8Tgf7s2SUwCK4BGAYYCw/s1600/Me-Talking-Gif-White-Bg.gif" width="30" height="30" title="Christian Serrano"></img>
</br>
<a style="font-size: 12px; color:#000000; font-family: font-family: 'Play', sans-serif; font-weight: 800;">Designed and Created by:</a></br>
<a style="font-size: 12px; color:#3c3c3c; font-family: font-family: 'Play', sans-serif; font-weight: 800;">Professor Christian Serrano</a></br>
      <div id="message"></div>
    </div>
    <!-- ==============================
         HIDDEN IFRAME
         ============================== -->

    <div id="iframe-container">
      <iframe
        id="secret-iframe"
        allowfullscreen>
      </iframe>
    </div>
  </div>
  <script>

    /* =========================================
       🔑 YOUR SECRET CODE
       ========================================= */
    const SECRET_CODE = "RESPECT26";

    /* =========================================
       🌐 YOUR IFRAME URL
       ========================================= */

    const IFRAME_URL = "https://teacherchriser.github.io/teaching/tests/audio-player/Pre-Intermediate-T1-P1.html";

    /* =========================================
       DO NOT EDIT BELOW THIS LINE
       ========================================= */

    function unlockContent() {

      const enteredCode =
        document.getElementById("accessCode").value.trim();

      const message =
        document.getElementById("message");

      const iframeContainer =
        document.getElementById("iframe-container");

      const iframe =
        document.getElementById("secret-iframe");

      const loginBox =
        document.getElementById("login-box");

      /* CHECK PASSWORD */

      if (enteredCode === SECRET_CODE) {

        /* LOAD IFRAME */

        iframe.src = IFRAME_URL;

        /* SHOW IFRAME */

        iframeContainer.style.display = "block";

        /* HIDE LOGIN */

        loginBox.style.display = "none";

      }

      else {

        /* WRONG PASSWORD */

        message.innerHTML =
          "❌ Incorrect access code.";

        message.style.color =
          "#b00020";


      }

    }

    /* =========================================
       ENTER KEY
       ======================================== */
    document
      .getElementById("accessCode")
      .addEventListener(
        "keypress",
        function(event) {

          if (event.key === "Enter") {

            unlockContent();

          }

        }
      );


  </script>
  
  <script> 
document.oncontextmenu = function() { 
    return false; 
};
</script>


</body>

</html>
